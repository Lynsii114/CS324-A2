
syntax = "proto3";
package cluster;
option go_package = "cluster/v1;clusterv1";
option java_multiple_files = true;
option java_package = "com.cs324.coordinator.grpc";
option java_outer_classname = "CoordinatorProto";

service CoordinatorService {
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  rpc StreamProgress(stream ProgressReport) returns (ProgressSummary);
  rpc RecoverState(RecoveryRequest) returns (SnapshotState);
}

message RegisterRequest { string worker_ip = 1; int32 worker_port = 2; repeated string capabilities = 3; }
message RegisterResponse { string worker_id = 1; bool status = 2; string error_message = 3; }
message ProgressReport { string worker_id = 1; string task_id = 2; int32 segment_id = 3; float completion_percentage = 4; int64 rows_processed = 5; string status_message = 6; int32 total_segments = 7; }
message ProgressSummary { bool acknowledged = 1; }
message RecoveryRequest { string coordinator_id = 1; int64 last_known_sequence = 2; }
message SnapshotState { int64 snapshot_timestamp = 1; repeated WorkerMetadata active_workers = 2; repeated TaskAssignment ongoing_assignments = 3; repeated TaskResult completed_results = 4; }
message WorkerMetadata { string worker_id = 1; string worker_endpoint = 2; string status = 3; }
message TaskAssignment { string task_id = 1; string assigned_worker_id = 2; int32 total_segments = 3; repeated int32 assigned_segments = 4; int64 assigned_at_timestamp = 5; }
message TaskResult { string task_id = 1; string status = 2; string output_location = 3; int64 execution_time_ms = 4; }
