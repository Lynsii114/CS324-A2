syntax = "proto3";

// The single blueprint for all inter-process communication in the cluster.
// Every message that used to be an RMI serializable DTO, and every method that
// used to be a Remote interface method, is declared here; the Java classes and
// stubs used by the bootstrap, worker and client projects are generated from
// this file only.

package cs324;

option java_multiple_files = true;
option java_package = "com.cs324.grpc";
option java_outer_classname = "ClusterProto";

// ---------------------------------------------------------------- primitives

message Empty {}

message IntValue {
  int32 value = 1;
}

message LongValue {
  int64 value = 1;
}

message StringValue {
  string value = 1;
}

// ---------------------------------------------------------------- membership

// A worker that has registered with the Bootstrap Node.
message WorkerInfo {
  int32 workerId = 1;
  string host = 2;
  int32 port = 3;
}

message WorkerId {
  int32 workerId = 1;
}

message WorkerList {
  repeated WorkerInfo workers = 1;
}

message WorkerHeartbeat {
  int32 workerId = 1;
}

message WorkerStatus {
  int32 workerId = 1;
  string host = 2;
  int32 port = 3;
  string status = 4;
  int64 lastHeartbeatMillis = 5;
  bool coordinator = 6;
}

message ClusterStatus {
  repeated WorkerStatus workers = 1;
  int32 coordinatorId = 2;
}

// A GUI client that has connected through the Bootstrap Node.
message ClientInfo {
  string clientId = 1;
  string name = 2;
  string host = 3;
  int64 connectedAtMillis = 4;
}

message ClientList {
  repeated ClientInfo clients = 1;
}

// workerId -> startup priority id minted by the startup lottery.
message PriorityTable {
  map<int32, int32> priorities = 1;
}

// ---------------------------------------------------------------- election

// Snapshot of a worker taken at the moment an election runs.
message CandidateInfo {
  int32 workerId = 1;
  int32 jac = 2;
  int32 priorityId = 3;
  string host = 4;
  int32 port = 5;
}

// ELECTION message propagated hop-by-hop through neighbouring workers.
message ElectionMessage {
  string electionId = 1;
  CandidateInfo originator = 2;
  CandidateInfo sender = 3;
  repeated CandidateInfo participants = 4;
}

// Echo reply for an ELECTION message with the participant set discovered so far.
message ProcessedParticipants {
  string electionId = 1;
  CandidateInfo sender = 2;
  repeated CandidateInfo participants = 3;
}

// Result of an election, broadcast to every participant.
message WinnerAnnouncement {
  string electionId = 1;
  CandidateInfo winner = 2;
  repeated CandidateInfo participants = 3;
}

// ---------------------------------------------------------------- jobs

// Result of a distributed client job.
message TaskResult {
  string taskId = 1;
  string clientId = 2;
  string jobType = 3;
  int64 result = 4;
  int32 segmentCount = 5;
  repeated int32 workerIds = 6;
  int32 coordinatorId = 7;
  int64 startedAtMillis = 8;
  int64 completedAtMillis = 9;
}

message TaskHistory {
  repeated TaskResult tasks = 1;
}

message NumberList {
  repeated int32 numbers = 1;
}

message MaxJobRequest {
  string clientId = 1;
  NumberList numbers = 2;
}

message PrimeCountRequest {
  string clientId = 1;
  NumberList numbers = 2;
}

message PrimeSumRequest {
  string clientId = 1;
  int32 start = 2;
  int32 end = 3;
}

message RangeRequest {
  int32 start = 1;
  int32 end = 2;
}

message TermEndRequest {
  int32 priorCoordinatorId = 1;
  map<int32, int32> finalJacTable = 2;
}

// ---------------------------------------------------------------- services

// Membership only: tracks the active workers and sequences the startup lottery
// claims. Never takes part in leader election or job processing.
service BootstrapService {
  rpc registerWorker(WorkerInfo) returns (Empty);
  rpc unregisterWorker(WorkerId) returns (Empty);
  rpc workerHeartbeat(WorkerHeartbeat) returns (Empty);
  rpc getActiveWorkers(Empty) returns (WorkerList);
  rpc getClusterStatus(Empty) returns (ClusterStatus);
  rpc getRandomWorker(Empty) returns (WorkerInfo);
  rpc lotteryClaim(WorkerId) returns (IntValue);
  rpc getWorkerPriority(WorkerId) returns (IntValue);
  rpc getPriorityTable(Empty) returns (PriorityTable);
  rpc getClusterCompleteTime(Empty) returns (LongValue);
  rpc getClusterSize(Empty) returns (IntValue);
  rpc setClusterSize(IntValue) returns (IntValue);
  rpc registerClient(ClientInfo) returns (Empty);
  rpc unregisterClient(StringValue) returns (Empty);
  rpc getActiveClients(Empty) returns (ClientList);
}

// Worker node: state, neighbour management, distributed leader election and
// the segmented task distribution protocol.
service WorkerService {
  rpc getWorkerId(Empty) returns (IntValue);
  rpc getPriorityId(Empty) returns (IntValue);
  rpc getJobAllocationCounter(Empty) returns (IntValue);
  rpc incrementJobAllocationCounter(Empty) returns (IntValue);
  rpc recordJobAllocation(Empty) returns (IntValue);
  rpc resetJobAllocationCounter(Empty) returns (IntValue);
  rpc getJobsThisTerm(Empty) returns (IntValue);
  rpc getNeighbours(Empty) returns (WorkerList);
  rpc addNeighbour(WorkerInfo) returns (Empty);
  rpc addNeighbourById(WorkerId) returns (Empty);
  rpc removeNeighbour(WorkerId) returns (Empty);
  rpc getCurrentCoordinatorId(Empty) returns (IntValue);
  rpc setCurrentCoordinatorId(IntValue) returns (Empty);
  rpc getLeaderman(Empty) returns (StringValue);
  rpc syncNeighbours(Empty) returns (IntValue);
  rpc initiateElection(Empty) returns (StringValue);
  rpc receiveElection(ElectionMessage) returns (ProcessedParticipants);
  rpc announceWinner(WinnerAnnouncement) returns (Empty);
  rpc submitMaxJob(MaxJobRequest) returns (TaskResult);
  rpc computePartialMax(NumberList) returns (IntValue);
  rpc submitPrimeCount(PrimeCountRequest) returns (TaskResult);
  rpc countPrimes(NumberList) returns (IntValue);
  rpc submitPrimeSum(PrimeSumRequest) returns (TaskResult);
  rpc sumPrimeRange(RangeRequest) returns (LongValue);
  rpc getTaskHistory(Empty) returns (TaskHistory);
  rpc notifyTermEnd(TermEndRequest) returns (Empty);
}
