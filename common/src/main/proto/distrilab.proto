syntax = "proto3";

package distrilab;

option java_package = "com.cs324.proto";
option java_outer_classname = "Distrilab";
option java_multiple_files = true;

// ============================================================================
// DistriLab protocol definitions.
//
// These replace every Java-RMI communication in the legacy system with three
// gRPC services:
//   * BootstrapService - worker registration, membership, startup lottery,
//                        heartbeats and the replicated task ledger.
//   * ClusterService    - worker-to-worker contract (identity, neighbour ring,
//                        leader election, term handling, segment compute).
//   * ClientService     - client contract (job submission with SERVER
//                        STREAMING progress updates, status + history).
// ============================================================================

// ---------------------------------------------------------------------------
// Common messages
// ---------------------------------------------------------------------------

message Empty {}

// A worker node that has registered with the Bootstrap Node. `online` reflects
// the heartbeat view maintained by the Bootstrap Node (worker -> fault
// tolerance watchdog).
message WorkerInfo {
  int32 worker_id = 1;
  string host = 2;
  int32 port = 3;        // gRPC port hosting ClusterService + ClientService
  bool online = 4;
}

// Snapshot of a worker's live state (ClusterService.GetWorkerState).
message WorkerState {
  int32 worker_id = 1;
  string host = 2;
  int32 port = 3;
  int32 priority_id = 4;
  int32 jac = 5;
  int32 current_coordinator_id = 6;
  int32 jobs_this_term = 7;
  repeated WorkerInfo neighbours = 8;
  bool online = 9;
}

// Startup-lottery priority id (1..N, N = configured worker count); N = highest.
message CandidateInfo {
  int32 worker_id = 1;
  int32 jac = 2;
  int32 priority_id = 3;
  string host = 4;
  int32 port = 5;
}

// An ELECTION message propagated hop-by-hop over the neighbour ring. Carries a
// unique election id (for deduplication) and the growing participant set.
message ElectionMessage {
  string election_id = 1;
  CandidateInfo originator = 2;
  CandidateInfo sender = 3;
  repeated CandidateInfo participants = 4;
}

// Echo reply to an election message, carrying the merged participant set that a
// worker discovered in its subtree.
message ProcessedParticipants {
  string election_id = 1;
  CandidateInfo sender = 2;
  repeated CandidateInfo participants = 3;
}

// Result of an election, broadcast so every worker records the same coordinator.
message WinnerAnnouncement {
  string election_id = 1;
  CandidateInfo winner = 2;
  repeated CandidateInfo participants = 3;
}

// Term-End notification broadcast by a stepping-down coordinator, carrying its
// final verified JAC table (drives the lowest-JAC re-election).
message TermEndNotification {
  int32 prior_coordinator_id = 1;
  map<int32, int32> final_jac_table = 2;
}

// ---------------------------------------------------------------------------
// Client jobs
// ---------------------------------------------------------------------------

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  MAX = 1;
  PRIMECOUNT = 2;
  PRIMESUM = 3;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_RUNNING = 1;
  TASK_DONE = 2;
  TASK_FAILED = 3;
  TASK_RESUMED = 4;
}

// Per-worker progress breakdown for the client GUI drill-down view.
message WorkerProgress {
  int32 worker_id = 1;
  int32 tasks_assigned = 2;
  int32 tasks_completed = 3;
  int32 jac = 4;
  bool online = 5;
  string status = 6;   // e.g. "RUNNING", "IDLE", "FAILED", "REASSIGNED"
}

// A streamed progress update for one client task (ClientService.SubmitJob is
// server streaming, so a client receives these as the coordinator works).
message TaskUpdate {
  string task_id = 1;
  string client_id = 2;
  JobType job_type = 3;
  TaskStatus status = 4;
  int32 percent = 5;               // overall completion 0..100
  int32 segments_total = 6;
  int32 segments_completed = 7;
  repeated WorkerProgress workers = 8;   // worker-level breakdown
  string message = 9;
  // Present when status == TASK_DONE:
  int64 result = 10;
  repeated int32 used_worker_ids = 11;
  int32 coordinator_id = 12;
}

// Client job request - replaces the three legacy *submit* RMI methods by a
// unified payload. MAX / PRIMECOUNT carry `numbers`; PRIMESUM carries the
// inclusive range.
message JobRequest {
  string client_id = 1;
  JobType job_type = 2;
  repeated int32 numbers = 3;
  int32 range_start = 4;
  int32 range_end = 5;
  // Coordinator-failover resume: the client passes the task id of an
  // interrupted job so the new coordinator reconstructs it from the Bootstrap
  // Node's task ledger instead of restarting from scratch.
  string resume_task_id = 6;
}

message TaskStatusQuery {
  string task_id = 1;
}

message HistoryQuery {}

message TaskHistoryResponse {
  repeated TaskUpdate tasks = 1;
}

// ---------------------------------------------------------------------------
// Task ledger (coordinator fault-tolerance / state reconstruction)
// ---------------------------------------------------------------------------

// One record of a client task as the coordinator executes it. Published to the
// Bootstrap Node so that if the coordinator dies a freshly elected coordinator
// can reconstruct active client job states and task assignment tables.
message TaskLedgerEntry {
  string task_id = 1;
  string client_id = 2;
  JobType job_type = 3;
  int32 coordinator_id = 4;
  int64 started_at_ms = 5;
  int32 segments_total = 6;
  int64 accumulated_partial = 7;   // sum of completed segment partials so far
  int64 final_result = 8;          // valid when status == TASK_DONE
  TaskStatus status = 9;
  map<int32, SegmentRecord> segments = 10;  // segment index -> record
  repeated int32 used_workers = 11;
}

// One segment's assignment + completion state inside a task ledger entry.
message SegmentRecord {
  int32 segment_index = 1;
  int32 worker_id = 2;     // worker the segment is (or was) assigned to
  bool completed = 3;
  int64 partial = 4;       // partial result of this completed segment
  bool failed = 5;         // assigned worker died -> needs reassignment
  // Payload slice this segment covers (so a fresh coordinator can rebuild the
  // exact segment list from the ledger instead of recomputing it).
  int32 data_start = 6;    // MAX / PRIMECOUNT: begin index into JobRequest.numbers
  int32 data_length = 7;   // MAX / PRIMECOUNT: number of elements in this segment
  int32 range_start = 8;   // PRIMESUM: inclusive range begin
  int32 range_end = 9;     // PRIMESUM: inclusive range end
}

// Incremental segment update pushed by the coordinator while a task runs.
message SegmentUpdate {
  string task_id = 1;
  int32 segment_index = 2;
  int32 worker_id = 3;
  bool completed = 4;
  int64 partial = 5;
  bool failed = 6;
}

message TaskQuery {
  string task_id = 1;
}

message ActiveTasksResponse {
  repeated TaskLedgerEntry entries = 1;
}

// ---------------------------------------------------------------------------
// BootstrapService
// ---------------------------------------------------------------------------

service BootstrapService {

  // Worker registration on startup and re-registration after a join.
  rpc RegisterWorker(WorkerInfo) returns (Empty);

  rpc UnregisterWorker(WorkerIdRequest) returns (Empty);

  // Periodic worker heartbeat; refreshes the bootstrap's watchdog timestamp.
  rpc Heartbeat(WorkerIdRequest) returns (Empty);

  rpc GetActiveWorkers(Empty) returns (ActiveWorkersResponse);

  // Lots of getters:
  rpc GetRandomWorker(Empty) returns (WorkerInfo);

  // Startup lottery: assigns startup priority N, N-1, ..., 1 by claim order.
  rpc LotteryClaim(WorkerIdRequest) returns (LotteryClaimResponse);

  rpc GetWorkerPriority(WorkerIdRequest) returns (LotteryClaimResponse);

  rpc GetPriorityTable(Empty) returns (PriorityTableResponse);

  rpc GetClusterCompleteTime(Empty) returns (ClusterCompleteTimeResponse);

  rpc GetClusterSize(Empty) returns (ClusterSizeResponse);

  // --- Task ledger for coordinator state reconstruction ---

  rpc RecordTaskStart(TaskLedgerEntry) returns (Empty);

  rpc RecordSegmentUpdate(SegmentUpdate) returns (Empty);

  rpc RecordTaskCompletion(TaskLedgerEntry) returns (Empty);

  rpc RecordTaskFailure(TaskLedgerEntry) returns (Empty);

  rpc GetTaskLedger(TaskQuery) returns (TaskLedgerEntry);

  rpc ListActiveTasks(Empty) returns (ActiveTasksResponse);
}

message WorkerIdRequest {
  int32 worker_id = 1;
}

message ActiveWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message LotteryClaimResponse {
  int32 priority = 1;
}

message PriorityTableResponse {
  map<int32, int32> priorities = 1;
}

message ClusterCompleteTimeResponse {
  int64 epoch_millis = 1;
}

message ClusterSizeResponse {
  int32 size = 1;
}

// ---------------------------------------------------------------------------
// ClusterService (worker-to-worker, hosted on each worker's gRPC port)
// ---------------------------------------------------------------------------

service ClusterService {

  // Identity / state inspection (also used by the coordinator liveness monitor
  // and by the Bootstrap Node to feed fault detection).
  rpc GetWorkerState(Empty) returns (WorkerState);

  rpc IncrementJac(Empty) returns (JacResponse);

  rpc RecordAllocation(Empty) returns (JacResponse);

  rpc ResetJac(Empty) returns (JacResponse);

  // Neighbour-ring management (unstructured graph).
  rpc GetNeighbours(Empty) returns (NeighboursResponse);

  rpc AddNeighbour(WorkerInfo) returns (Empty);

  rpc RemoveNeighbour(WorkerIdRequest) returns (Empty);

  rpc SyncNeighbours(Empty) returns (SyncNeighboursResponse);

  // Coordinator agreement.
  rpc SetCurrentCoordinator(SetCoordinatorRequest) returns (Empty);

  rpc GetCurrentCoordinatorId(Empty) returns (CoordinatorIdResponse);

  // Distributed leader election (echo / participant-aggregation flood).
  rpc InitiateElection(Empty) returns (ElectionResult);

  rpc ReceiveElection(ElectionMessage) returns (ProcessedParticipants);

  rpc AnnounceWinner(WinnerAnnouncement) returns (Empty);

  rpc NotifyTermEnd(TermEndNotification) returns (Empty);

  // Segment computation (coordinator -> worker nodes).
  rpc ComputePartialMax(NumbersRequest) returns (SectionResult);

  rpc CountPrimes(NumbersRequest) returns (SectionResult);

  rpc SumPrimeRange(RangeRequest) returns (SectionResult);
}

message JacResponse {
  int32 value = 1;
}

message NeighboursResponse {
  repeated WorkerInfo neighbours = 1;
}

message SyncNeighboursResponse {
  int32 count = 1;
}

message SetCoordinatorRequest {
  int32 coordinator_id = 1;
}

message CoordinatorIdResponse {
  int32 value = 1;
}

message ElectionResult {
  string message = 1;
  int32 coordinator_id = 2;
}

message NumbersRequest {
  repeated int32 numbers = 1;
}

message RangeRequest {
  int32 start = 1;
  int32 end = 2;
}

message SectionResult {
  int64 value = 1;
}

// ---------------------------------------------------------------------------
// ClientService (client -> coordinator, hosted on each worker's gRPC port so
// any node can serve as coordinator)
// ---------------------------------------------------------------------------

service ClientService {

  // Job submission with gRPC SERVER STREAMING: the coordinator streams
  // TaskUpdate messages (percent complete + per-worker breakdown) as it
  // executes the task, and the final update carries the merged result.
  rpc SubmitJob(JobRequest) returns (stream TaskUpdate);

  // Status tracking for an in-flight / completed task (used after a stream was
  // interrupted during coordinator failover).
  rpc GetTaskStatus(TaskStatusQuery) returns (TaskUpdate);

  rpc GetTaskHistory(HistoryQuery) returns (TaskHistoryResponse);
}